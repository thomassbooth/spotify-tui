name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binaries
        run: |
          GOOS=darwin  GOARCH=arm64 go build -o bin/spotify-tui-mac-arm64    ./cmd/spotify-tui
          GOOS=darwin  GOARCH=amd64 go build -o bin/spotify-tui-mac-amd64    ./cmd/spotify-tui
          GOOS=linux   GOARCH=amd64 go build -o bin/spotify-tui-linux-amd64  ./cmd/spotify-tui
          GOOS=windows GOARCH=amd64 go build -o bin/spotify-tui-windows.exe  ./cmd/spotify-tui

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*